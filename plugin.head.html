<!-- JHU-CDHAI: AI Activity overlay panel.
     Opens a WebSocket to /hai/activity (proxied by jitsi-web nginx to
     hai-voice-server:8766/activity) and renders the bot's live activity
     stream — what it heard, what it said, which tools it called, and the
     tool replies. Toggled by a small floating "AI Activity" button. -->
<style>
  #hai-activity-toggle {
    position: fixed; bottom: 32px; right: 20px; z-index: 99998;
    padding: 10px 14px; border: none; border-radius: 24px;
    background: #2b3a55; color: #fff;
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    cursor: pointer; opacity: 0.9;
  }
  #hai-activity-toggle:hover { opacity: 1; }
  #hai-activity-toggle .hai-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; background: #999;
  }
  #hai-activity-toggle.live .hai-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }

  #hai-activity-panel {
    position: fixed; bottom: 80px; right: 20px; z-index: 99998;
    width: 360px; max-height: 60vh;
    background: #1f2a44; color: #f4f8fd;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: none; flex-direction: column;
    overflow: hidden;
  }
  #hai-activity-panel.open { display: flex; }
  #hai-activity-header {
    padding: 10px 14px; background: #18213a;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #hai-activity-header strong { font-size: 13px; }
  #hai-activity-clear, #hai-activity-close {
    background: transparent; border: none; color: #9bb1d4;
    cursor: pointer; font-size: 12px; padding: 4px 6px;
  }
  #hai-activity-clear:hover, #hai-activity-close:hover { color: #fff; }
  #hai-activity-log {
    flex: 1 1 auto; overflow-y: auto; padding: 8px 12px;
  }
  #hai-activity-log .hai-empty {
    color: #7a8aab; font-style: italic; text-align: center; padding: 18px 0;
  }
  .hai-evt {
    display: flex; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .hai-evt .hai-icon { flex: 0 0 22px; font-size: 16px; line-height: 1.4; }
  .hai-evt .hai-body { flex: 1 1 auto; min-width: 0; }
  .hai-evt .hai-title {
    font-size: 11px; color: #9bb1d4; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 2px;
  }
  .hai-evt .hai-text { word-wrap: break-word; white-space: pre-wrap; }
  .hai-evt .hai-time { flex: 0 0 auto; font-size: 10px; color: #7a8aab; }
  .hai-evt.heard .hai-icon { color: #fbbf24; }
  .hai-evt.spoke .hai-icon { color: #60a5fa; }
  .hai-evt.tool_call .hai-icon { color: #a78bfa; }
  .hai-evt.tool_reply .hai-icon { color: #34d399; }
  .hai-evt.log { padding: 3px 0; opacity: 0.72; }
  .hai-evt.log .hai-icon { color: #6b7c9a; font-size: 11px; }
  .hai-evt.log .hai-title { font-size: 9px; color: #6b7c9a; }
  .hai-evt.log .hai-text { font-size: 11px; color: #c2cee0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hai-evt.log.WARNING .hai-icon { color: #fbbf24; }
  .hai-evt.log.ERROR .hai-icon, .hai-evt.log.ERROR .hai-text { color: #f87171; }
  #hai-activity-toolbar {
    display: flex; gap: 4px; padding: 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: #18213a; font-size: 11px;
  }
  #hai-activity-toolbar label {
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    color: #9bb1d4;
  }
  #hai-activity-toolbar label:hover { color: #fff; }
  #hai-activity-toolbar input { margin: 0; }
</style>
<script>
(function () {
    var ICONS = { heard:'🎤', spoke:'💬', tool_call:'🛠️', tool_reply:'✅', hello:'🟢', log:'·' };
    var LABELS = { heard:'heard', spoke:'replied', tool_call:'tool call', tool_reply:'tool reply', hello:'connected', log:'log' };
    var ws=null, retryDelay=1000;
    var toggle, panel, log;
    var showLogs = true;  // toggleable via toolbar

    function fmtTime(ts) {
        var d = new Date(ts || Date.now());
        return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
    }
    function summary(evt) {
        if (evt.type === 'tool_call') {
            var args = evt.args ? JSON.stringify(evt.args) : '';
            return evt.tool + (args ? ' ' + args : '');
        }
        if (evt.type === 'tool_reply') {
            return evt.tool + ' → ' + (evt.result || '').slice(0, 320);
        }
        if (evt.type === 'log') {
            return (evt.tag ? '[' + evt.tag + '] ' : '') + (evt.message || '');
        }
        return evt.text || '';
    }
    function renderEvent(evt) {
        if (evt.type === 'log' && !showLogs) { return; }
        if (log.firstChild && log.firstChild.classList && log.firstChild.classList.contains('hai-empty')) {
            log.innerHTML = '';
        }
        var row = document.createElement('div');
        row.className = 'hai-evt ' + evt.type + (evt.level ? ' ' + evt.level : '');
        var icon = document.createElement('div');
        icon.className = 'hai-icon'; icon.textContent = ICONS[evt.type] || '·';
        var body = document.createElement('div');
        body.className = 'hai-body';
        var title = document.createElement('div');
        title.className = 'hai-title'; title.textContent = LABELS[evt.type] || evt.type;
        var text = document.createElement('div');
        text.className = 'hai-text'; text.textContent = summary(evt);
        body.appendChild(title); body.appendChild(text);
        var time = document.createElement('div');
        time.className = 'hai-time'; time.textContent = fmtTime(evt.ts);
        row.appendChild(icon); row.appendChild(body); row.appendChild(time);
        log.appendChild(row);
        while (log.childElementCount > 200) { log.removeChild(log.firstChild); }
        log.scrollTop = log.scrollHeight;
    }
    function setLive(live) {
        if (live) toggle.classList.add('live'); else toggle.classList.remove('live');
    }
    function connect() {
        try {
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/hai/activity');
        } catch (e) {
            console.warn('[hai-activity] connect failed:', e);
            scheduleRetry(); return;
        }
        ws.onopen = function () { setLive(true); retryDelay = 1000; };
        ws.onclose = function () { setLive(false); scheduleRetry(); };
        ws.onerror = function () {};
        ws.onmessage = function (e) {
            try { renderEvent(JSON.parse(e.data)); }
            catch (err) { console.warn('[hai-activity] bad frame:', e.data); }
        };
    }
    function scheduleRetry() {
        setTimeout(connect, retryDelay);
        retryDelay = Math.min(retryDelay * 2, 15000);
    }
    function buildUI() {
        if (document.getElementById('hai-activity-toggle')) { return; }
        toggle = document.createElement('button');
        toggle.id = 'hai-activity-toggle';
        toggle.innerHTML = '<span class="hai-dot"></span>AI Activity';
        toggle.title = 'Show what the AI bot is hearing / saying / doing';
        panel = document.createElement('div');
        panel.id = 'hai-activity-panel';
        panel.innerHTML =
            '<div id="hai-activity-header"><strong>AI Activity</strong>'
            + '<div><button id="hai-activity-clear" title="Clear log">clear</button>'
            + '<button id="hai-activity-close" title="Close">✕</button></div></div>'
            + '<div id="hai-activity-toolbar">'
              + '<label><input type="checkbox" id="hai-activity-show-logs" checked />debug logs</label>'
            + '</div>'
            + '<div id="hai-activity-log"><div class="hai-empty">Waiting for the AI bot…</div></div>';
        document.body.appendChild(toggle);
        document.body.appendChild(panel);
        log = document.getElementById('hai-activity-log');
        toggle.onclick = function () { panel.classList.toggle('open'); };
        document.getElementById('hai-activity-close').onclick = function () { panel.classList.remove('open'); };
        document.getElementById('hai-activity-clear').onclick = function () {
            log.innerHTML = '<div class="hai-empty">cleared</div>';
        };
        document.getElementById('hai-activity-show-logs').onchange = function (e) {
            showLogs = e.target.checked;
            // Hide/show already-rendered log rows
            Array.from(log.querySelectorAll('.hai-evt.log')).forEach(function (el) {
                el.style.display = showLogs ? '' : 'none';
            });
        };
    }
    function init() {
        var path = location.pathname.replace(/^\/+|\/+$/g, '');
        var last = path.split('/').pop();
        if (!last || last.indexOf('.') !== -1) { return; }
        buildUI();
        connect();
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(init, 800);
    } else {
        window.addEventListener('DOMContentLoaded', function () { setTimeout(init, 800); });
    }
})();
</script>
